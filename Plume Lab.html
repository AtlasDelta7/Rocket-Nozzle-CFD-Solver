<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume Lab — Rocket Nozzle Flow Simulator</title>
<style>
:root {
  --bg: #06070b; --bg2: #0b0d13; --panel: #0d1017; --line: #1b2030; --line2: #262c3f;
  --text: #c9d0de; --dim: #6d7689; --dimmer: #464e60; --accent: #3fd0ff; --accent2: #5cf2a8;
  --warn: #ffb547; --bad: #ff6b6b;
  --mono: "JetBrains Mono", "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }
button, select, input { font-family: inherit; font-size: inherit; color: inherit; }
#app { display: flex; height: 100vh; width: 100vw; }
#stage { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#topbar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); flex-wrap: wrap; }
#brand { font-family: var(--mono); font-size: 12px; letter-spacing: .22em; color: var(--text); margin-right: 14px; white-space: nowrap; }
#brand b { color: var(--accent); font-weight: 600; }
.tab { background: transparent; border: 1px solid transparent; color: var(--dim); padding: 5px 9px; border-radius: 4px; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.tab:hover { color: var(--text); border-color: var(--line2); }
.tab.on { color: var(--bg); background: var(--accent); }
#viewport { flex: 1; position: relative; min-height: 0; background: #000; cursor: crosshair; }
#viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud-top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; padding: 10px 14px; pointer-events: none;
  font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: rgba(200,210,230,.55); text-transform: uppercase; }
#hud-top .big { color: rgba(220,230,245,.85); }
#probe { position: absolute; pointer-events: none; display: none; background: rgba(8,10,16,.88); border: 1px solid var(--line2); border-radius: 4px; padding: 6px 8px;
  font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--text); white-space: pre; z-index: 5; }
#msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 520px; text-align: center; background: rgba(10,12,18,.95);
  border: 1px solid var(--line2); border-radius: 8px; padding: 20px 24px; display: none; line-height: 1.6; z-index: 10; }
#hud { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); background: var(--bg2); }
.metric { padding: 10px 14px 9px; border-right: 1px solid var(--line); min-width: 0; }
.metric:last-child { border-right: 0; }
.metric .k { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
.metric .v { font-family: var(--mono); font-size: 22px; color: #e6ebf5; margin-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.metric .v small { font-size: 11px; color: var(--dim); margin-left: 3px; letter-spacing: .05em; }
.metric .s { font-family: var(--mono); font-size: 10px; color: var(--dimmer); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#transport { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-top: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.btn { background: var(--panel); border: 1px solid var(--line2); color: var(--text); padding: 6px 11px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #02121a; border-color: var(--accent); font-weight: 600; }
.btn.rec { border-color: #5a2a2a; }
.btn.rec.on { background: #c0392b; border-color: #e74c3c; color: #fff; }
.btn.on { border-color: var(--accent); color: var(--accent); }
#transport .sep { width: 1px; height: 20px; background: var(--line2); margin: 0 4px; }
#transport .lbl { color: var(--dim); font-size: 12px; }
#footer { font-family: var(--mono); font-size: 10px; color: var(--dimmer); letter-spacing: .12em; text-transform: uppercase; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#panel { width: 360px; flex: 0 0 360px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#panel.hidden { display: none; }
#panel-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
#panel-head select { flex: 1; }
#panel-body { overflow-y: auto; flex: 1; padding: 0 0 30px; }
#panel-body::-webkit-scrollbar { width: 8px; }
#panel-body::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
details.sec { border-bottom: 1px solid var(--line); }
details.sec > summary { list-style: none; cursor: pointer; padding: 11px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; }
details.sec > summary::after { content: '+'; color: var(--dimmer); }
details.sec[open] > summary::after { content: '–'; }
details.sec > summary:hover { color: var(--text); }
.sec-body { padding: 2px 14px 12px; }
.row { margin: 9px 0 11px; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.row .name { color: var(--text); font-size: 12.5px; }
.row .name .live { color: var(--accent2); font-size: 9px; font-family: var(--mono); letter-spacing: .1em; margin-left: 5px; vertical-align: 1px; }
.row .val { font-family: var(--mono); font-size: 12px; color: var(--accent); white-space: nowrap; }
.row .val input { width: 70px; background: transparent; border: 1px solid transparent; color: var(--accent); text-align: right; font-family: var(--mono); font-size: 12px; padding: 1px 3px; border-radius: 3px; }
.row .val input:hover, .row .val input:focus { border-color: var(--line2); outline: none; background: var(--bg); }
.row .val .u { color: var(--dim); margin-left: 3px; }
.row .hint { color: var(--dimmer); font-size: 11px; margin-top: 3px; }
select { background: var(--bg); border: 1px solid var(--line2); border-radius: 5px; padding: 6px 8px; color: var(--text); width: 100%; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--line2); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); margin-top: -5px; border: 2px solid #02121a; }
input[type=range]::-moz-range-track { height: 3px; background: var(--line2); }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid #02121a; }
.toggle { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { flex: 1; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 4px; cursor: pointer; color: var(--dim); font-size: 12px; }
.seg button.on { border-color: var(--accent); color: var(--accent); }
table.th { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
table.th td { padding: 4px 0; border-bottom: 1px solid var(--line); }
table.th td:first-child { color: var(--dim); }
table.th td.n { text-align: right; color: var(--text); white-space: nowrap; }
table.th tr.head td { color: var(--dimmer); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
.state { display: inline-block; padding: 2px 7px; border-radius: 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; }
.state.under { background: rgba(63,208,255,.13); color: var(--accent); }
.state.over { background: rgba(255,181,71,.13); color: var(--warn); }
.state.ideal { background: rgba(92,242,168,.13); color: var(--accent2); }
.state.vac { background: rgba(180,140,255,.13); color: #b48cff; }
.note { color: var(--dim); font-size: 11.5px; line-height: 1.55; margin: 8px 0; }
.note.warn { color: var(--warn); }
.kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 4px; color: var(--dim); }
#panel-toggle { position: absolute; right: 10px; top: 52px; z-index: 6; }
@media (max-width: 900px) {
  #app { flex-direction: column; }
  #panel { width: 100%; flex: 1 1 45%; border-left: 0; border-top: 1px solid var(--line); }
  #hud { grid-template-columns: repeat(3, 1fr); }
  .metric .v { font-size: 17px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="topbar">
      <div id="brand">PLUME<b>LAB</b></div>
      <div id="tabs"></div>
    </div>
    <div id="viewport">
      <canvas id="gl"></canvas>
      <canvas id="overlay"></canvas>
      <div id="hud-top"><div><span id="fieldname" class="big">Temperature field</span><br><span id="simtime">T+ 0.000 ms</span></div>
        <div style="text-align:right"><span id="solvestat">—</span><br><span id="gridstat">—</span></div></div>
      <div id="probe"></div>
      <div id="msg"></div>
    </div>
    <div id="hud">
      <div class="metric"><div class="k">Thrust</div><div class="v" id="m-thrust">—</div><div class="s" id="s-thrust">ideal —</div></div>
      <div class="metric"><div class="k">Exit Mach</div><div class="v" id="m-mach">—</div><div class="s" id="s-mach">ideal —</div></div>
      <div class="metric"><div class="k">Chamber</div><div class="v" id="m-tc">—</div><div class="s" id="s-tc">target —</div></div>
      <div class="metric"><div class="k">Pc</div><div class="v" id="m-pc">—</div><div class="s" id="s-pc">target —</div></div>
      <div class="metric"><div class="k">Isp</div><div class="v" id="m-isp">—</div><div class="s" id="s-isp">ideal —</div></div>
      <div class="metric"><div class="k">Pe / Pa</div><div class="v" id="m-ratio">—</div><div class="s" id="s-ratio">—</div></div>
    </div>
    <div id="transport">
      <button class="btn primary" id="b-play" title="Space">❚❚ Pause</button>
      <button class="btn" id="b-restart" title="R">↺ Restart</button>
      <button class="btn" id="b-step" title="N">Step</button>
      <div class="sep"></div>
      <span class="lbl">Speed</span>
      <input type="range" id="speed" min="1" max="100" step="1" value="20" style="width:110px">
      <span class="lbl" id="speedval" style="font-family:var(--mono);width:68px">20 st/fr</span>
      <div class="sep"></div>
      <button class="btn rec" id="b-rec" title="V">● Record</button>
      <button class="btn" id="b-shot" title="S">Screenshot</button>
      <button class="btn" id="b-panel" title="H">Panel</button>
      <div id="footer">2D axisymmetric · inviscid Euler · frozen-γ · HLLC / MUSCL · GPU</div>
    </div>
  </div>
  <div id="panel">
    <div id="panel-head"><select id="preset"></select></div>
    <div id="panel-body"></div>
  </div>
</div>
<script>
// ===== physics.js =====
// ============================================================================
// physics.js — atmosphere, 1-D isentropic nozzle theory, nozzle contour,
// propellant + engine presets. All SI units unless stated.
// ============================================================================
'use strict';

const G0 = 9.80665;
const RU = 8314.462618;          // J/(kmol K)
const R_AIR = 287.053;           // J/(kg K)
// Normalisation used by the GPU solver (keeps float32 well-conditioned)
const P_REF = 101325.0;
const T_REF = 288.15;
const R_REF = R_AIR;
const RHO_REF = P_REF / (R_REF * T_REF);   // 1.225 kg/m^3
const U_REF = Math.sqrt(P_REF / RHO_REF);  // ~287.6 m/s

// ---------------------------------------------------------------------------
// US Standard Atmosphere 1976 (geopotential approx, 0–86 km)
// ---------------------------------------------------------------------------
const ISA_LAYERS = [
  // h_base (m), T_base (K), lapse (K/m), p_base (Pa)
  [0, 288.15, -0.0065, 101325.0],
  [11000, 216.65, 0.0, 22632.06],
  [20000, 216.65, 0.001, 5474.889],
  [32000, 228.65, 0.0028, 868.0187],
  [47000, 270.65, 0.0, 110.9063],
  [51000, 270.65, -0.0028, 66.93887],
  [71000, 214.65, -0.002, 3.956420],
  [86000, 186.87, 0.0, 0.3734],
];
function atmosphere(h) {
  h = Math.max(0, Math.min(h, 120000));
  let L = ISA_LAYERS[0];
  for (const layer of ISA_LAYERS) if (h >= layer[0]) L = layer;
  const [hb, Tb, lapse, pb] = L;
  const k = G0 / R_AIR; // 0.034163 K/m
  let T, p;
  if (Math.abs(lapse) < 1e-12) {
    T = Tb;
    p = pb * Math.exp(-k * (h - hb) / Tb);
  } else {
    T = Tb + lapse * (h - hb);
    p = pb * Math.pow(Tb / T, k / lapse);
  }
  return { T, p, rho: p / (R_AIR * T), a: Math.sqrt(1.4 * R_AIR * T) };
}

// ---------------------------------------------------------------------------
// Isentropic relations
// ---------------------------------------------------------------------------
function areaRatioFromMach(M, g) {
  const t = (2 / (g + 1)) * (1 + 0.5 * (g - 1) * M * M);
  return Math.pow(t, (g + 1) / (2 * (g - 1))) / M;
}
function machFromAreaRatio(eps, g, supersonic = true) {
  if (eps <= 1.0) return 1.0;
  let lo = supersonic ? 1.0 : 1e-6, hi = supersonic ? 100.0 : 1.0;
  for (let k = 0; k < 200; k++) {
    const mid = 0.5 * (lo + hi);
    const f = areaRatioFromMach(mid, g) - eps;
    if (supersonic) { if (f > 0) hi = mid; else lo = mid; }
    else { if (f > 0) lo = mid; else hi = mid; }
  }
  return 0.5 * (lo + hi);
}
function machFromPressureRatio(p0_over_p, g) {
  return Math.sqrt(Math.max(0, (Math.pow(p0_over_p, (g - 1) / g) - 1) * 2 / (g - 1)));
}

// Ideal (1-D, isentropic, frozen-gamma) rocket nozzle performance
function nozzleTheory(o) {
  // o: { Pc, Tc, gamma, Mw, Dt, De, pa }
  const g = o.gamma, R = RU / o.Mw;
  const At = Math.PI * 0.25 * o.Dt * o.Dt;
  const Ae = Math.PI * 0.25 * o.De * o.De;
  const eps = Ae / At;
  const Me = machFromAreaRatio(eps, g, true);
  const fT = 1 + 0.5 * (g - 1) * Me * Me;
  const pe = o.Pc * Math.pow(fT, -g / (g - 1));
  const Te = o.Tc / fT;
  const ue = Me * Math.sqrt(g * R * Te);
  const Gam = Math.sqrt(g) * Math.pow(2 / (g + 1), (g + 1) / (2 * (g - 1)));
  const cstar = Math.sqrt(R * o.Tc) / Gam;
  const mdot = o.Pc * At / cstar;
  const F = mdot * ue + (pe - o.pa) * Ae;
  const Fvac = mdot * ue + pe * Ae;
  const Mopt = machFromPressureRatio(o.Pc / Math.max(o.pa, 1e-3), g);
  const epsOpt = o.pa > 1 ? areaRatioFromMach(Math.max(Mopt, 1.0001), g) : Infinity;
  const ratio = pe / Math.max(o.pa, 1e-9);
  let state;
  if (o.pa < 1) state = 'vacuum';
  else if (ratio > 1.08) state = 'under-expanded';
  else if (ratio < 0.92) state = 'over-expanded';
  else state = 'near-ideal';
  const separation = (o.pa > 1) && pe < 0.4 * o.pa; // Summerfield criterion
  const uLim = Math.sqrt(2 * g / (g - 1) * R * o.Tc);
  return {
    At, Ae, eps, Me, pe, Te, ue, cstar, mdot, F, Fvac, Cf: F / (o.Pc * At),
    Isp: F / (mdot * G0), IspVac: Fvac / (mdot * G0), epsOpt, ratio, state, separation,
    c0: Math.sqrt(g * R * o.Tc), uLim, R,
  };
}

// ---------------------------------------------------------------------------
// Nozzle contour (inner wall radius vs axial position). Rao-style thrust-
// optimised parabola (quadratic Bezier) or straight cone.
// ---------------------------------------------------------------------------
function raoAngles(eps, pct) {
  // Fits to the classic Rao charts (80% bell), shifted for other lengths.
  const le = Math.log10(Math.max(eps, 2));
  let thn = 14.5 + 11.0 * le;     // ~21.5° @ ε=4, ~33° @ ε=50
  let the = 16.5 - 5.3 * le;      // ~13° @ ε=4, ~7.5° @ ε=50
  const d = 80 - pct;
  thn += d * 0.30; the += d * 0.22;
  thn = Math.min(Math.max(thn, 12), 48);
  the = Math.min(Math.max(the, 2), thn - 4);
  return { thn: thn * Math.PI / 180, the: the * Math.PI / 180 };
}

function buildContour(o) {
  // o: { Dt, De, type:'bell'|'cone', bellPct, coneAngle (deg), CR, chamberLen (×Rc) }
  const Rt = 0.5 * o.Dt, Re = Math.max(0.5 * o.De, Rt * 1.001);
  const Rc = Rt * Math.sqrt(Math.max(o.CR, 1.5));
  const Lc = Math.max(o.chamberLen * Rc, 1.5 * Rt);
  const thc = 35 * Math.PI / 180;           // converging half-angle
  const Ru = 1.5 * Rt;                      // upstream throat radius of curvature
  const Rf = Math.min(0.6 * Rc, 1.0 * Rt * 1.5); // chamber fillet
  const pts = [];
  const push = (x, r) => { if (!pts.length || x > pts[pts.length - 1][0] + 1e-12) pts.push([x, r]); };
  // chamber cylinder
  push(0, Rc); push(Lc, Rc);
  // fillet (chamber -> cone)
  const nA = 24;
  for (let k = 1; k <= nA; k++) {
    const ph = thc * k / nA;
    push(Lc + Rf * Math.sin(ph), Rc - Rf * (1 - Math.cos(ph)));
  }
  let [x1, r1] = pts[pts.length - 1];
  const r2 = Rt + Ru * (1 - Math.cos(thc));
  if (r1 > r2) {
    const x2 = x1 + (r1 - r2) / Math.tan(thc);
    push(x2, r2); x1 = x2; r1 = r2;
  }
  // upstream throat arc
  const xt = x1 + Ru * Math.sin(thc);
  for (let k = 1; k <= nA; k++) {
    const ph = thc * (1 - k / nA);
    push(xt - Ru * Math.sin(ph), Rt + Ru * (1 - Math.cos(ph)));
  }
  // downstream throat arc
  const Rd = 0.382 * Rt;
  const eps = (Re * Re) / (Rt * Rt);
  let thn, the, xe;
  if (o.type === 'cone') {
    thn = (o.coneAngle || 15) * Math.PI / 180; the = thn;
  } else {
    const a = raoAngles(eps, o.bellPct || 80); thn = a.thn; the = a.the;
  }
  for (let k = 1; k <= nA; k++) {
    const ph = thn * k / nA;
    push(xt + Rd * Math.sin(ph), Rt + Rd * (1 - Math.cos(ph)));
  }
  const [xN, rN] = pts[pts.length - 1];
  if (o.type === 'cone') {
    xe = xN + (Re - rN) / Math.tan(thn);
    const n = 40;
    for (let k = 1; k <= n; k++) push(xN + (xe - xN) * k / n, rN + (Re - rN) * k / n);
  } else {
    const L15 = (Re - Rt) / Math.tan(15 * Math.PI / 180);
    xe = xt + (o.bellPct || 80) / 100 * L15;
    xe = Math.max(xe, xN + (Re - rN) / Math.tan(thn) * 1.02);
    const tn = Math.tan(thn), te = Math.tan(the);
    let qx = (Re - rN + xN * tn - xe * te) / (tn - te);
    qx = Math.min(Math.max(qx, xN + 1e-6), xe - 1e-6);
    let qr = rN + tn * (qx - xN);
    qr = Math.min(Math.max(qr, rN), Re * 1.2);
    const n = 80;
    for (let k = 1; k <= n; k++) {
      const s = k / n, a = (1 - s) * (1 - s), b = 2 * s * (1 - s), c = s * s;
      push(a * xN + b * qx + c * xe, a * rN + b * qr + c * Re);
    }
  }
  xe = pts[pts.length - 1][0];
  // fast lookup: radius at x (linear interpolation, x monotone)
  const xs = pts.map(p => p[0]), rs = pts.map(p => p[1]);
  function radiusAt(x) {
    if (x <= 0) return Rc;
    if (x >= xe) return Re;
    let lo = 0, hi = xs.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] <= x) lo = m; else hi = m; }
    const t = (x - xs[lo]) / (xs[hi] - xs[lo]);
    return rs[lo] + t * (rs[hi] - rs[lo]);
  }
  return { pts, Rt, Re, Rc, Lc, xt, xe, eps, radiusAt, thn, the };
}

// ---------------------------------------------------------------------------
// Presets
// ---------------------------------------------------------------------------
const PROPELLANTS = {
  kerolox:  { name: 'LOX / RP-1 (kerolox)',  Tc: 3670, gamma: 1.22, Mw: 22.0 },
  methalox: { name: 'LOX / CH4 (methalox)',  Tc: 3550, gamma: 1.21, Mw: 20.5 },
  hydrolox: { name: 'LOX / LH2 (hydrolox)',  Tc: 3400, gamma: 1.20, Mw: 13.5 },
  hybrid:   { name: 'N2O / HTPB (hybrid)',   Tc: 3150, gamma: 1.23, Mw: 26.0 },
  solid:    { name: 'APCP (solid motor)',    Tc: 3100, gamma: 1.20, Mw: 25.0 },
  hydrazine:{ name: 'Hydrazine monoprop',    Tc: 1150, gamma: 1.28, Mw: 13.0 },
  coldgas:  { name: 'Cold gas (nitrogen)',   Tc: 300,  gamma: 1.40, Mw: 28.0 },

// ===== cutcell.js =====
// ============================================================================
// cutcell.js — embedded-boundary ("cut-cell") geometry for the solver.
//
// For every cell: r-weighted fluid volume V = ∫∫ r dx dr and meridional area
// Am = ∫∫ dx dr. For every face: r-weighted open area (x-faces: ∫ r dr over
// the open part; r-faces: r_face × open length). The wall vector of a cut cell
// follows from the closure (divergence theorem), so uniform pressure stays
// exactly in balance. Slivers with volume fraction < 0.5 are merged into the
// neighbour they share the largest open face with, which keeps the explicit
// time step stable. All lengths in grid units (cell size = 1).
// ============================================================================
'use strict';

function buildCutGeometry(o) {
  // o: { Nx, Nr, dx, contour, tw, base, xBase, bodyR, mode: 'cut' | 'stair' }
  const { Nx, Nr, dx, contour } = o;
  const cut = o.mode !== 'stair';
  const xeC = contour.xe / dx, twC = o.tw / dx, xBaseC = o.xBase / dx, bodyC = o.bodyR / dx;
  // fine table of the inner-wall radius (cells) every 1/SUB cell in x
  const SUB = 8;
  const nTab = Nx * SUB + 1;
  const Rtab = new Float32Array(nTab);
  for (let k = 0; k < nTab; k++) {
    const X = (k / SUB) * dx;
    Rtab[k] = X <= contour.xe ? contour.radiusAt(X) / dx : -1e9;
  }
  const RinAt = (xc) => {
    if (xc > xeC) return -1e9;
    const f = Math.min(Math.max(xc * SUB, 0), nTab - 1);
    const k = Math.min(Math.floor(f), nTab - 2), t = f - k;
    const a = Rtab[k], b = Rtab[k + 1];
    if (a < -1e8 || b < -1e8) return contour.radiusAt(Math.min(xc * dx, contour.xe)) / dx;
    return a + (b - a) * t;
  };
  const fluid = (xc, rc) => {
    if (xc <= xeC) {
      const ri = RinAt(xc);
      if (rc >= ri && rc <= ri + twC) return false;
      if (o.base && xc < xBaseC && rc >= ri && rc < bodyC) return false;
    }
    return true;
  };
  // per column: radius range of the inner wall over [i, i+1]
  const colMin = new Float32Array(Nx), colMax = new Float32Array(Nx);
  for (let i = 0; i < Nx; i++) {
    let mn = 1e9, mx = -1e9;
    for (let a = 0; a <= SUB; a++) { const k = i * SUB + a; const r = Rtab[k]; if (r > -1e8) { mn = Math.min(mn, r); mx = Math.max(mx, r); } }
    colMin[i] = mn; colMax[i] = mx;
  }
  const overlaps = (a0, a1, b0, b1) => a0 < b1 && a1 > b0;
  const maybeCut = (i, j) => {
    if (!cut) return false;
    const x0 = i, x1 = i + 1, r0 = j, r1 = j + 1;
    if (colMax[i] < -1e8) return false;          // column entirely downstream of the nozzle
    const mn = colMin[i], mx = colMax[i];
    if (overlaps(r0, r1, mn - 1e-6, mx + 1e-6)) return true;
    if (overlaps(r0, r1, mn + twC - 1e-6, mx + twC + 1e-6)) return true;
    if (xeC >= x0 && xeC <= x1 && overlaps(r0, r1, mn, mx + twC)) return true;
    if (o.base) {
      if (xBaseC >= x0 && xBaseC <= x1 && overlaps(r0, r1, mn, bodyC)) return true;
      if (x0 < xBaseC && bodyC >= r0 && bodyC <= r1) return true;
    }
    return false;
  };

  const NC = 8, NF = 12;
  const V = new Float32Array(Nx * Nr), Am = new Float32Array(Nx * Nr), isCut = new Uint8Array(Nx * Nr);
  for (let j = 0; j < Nr; j++) for (let i = 0; i < Nx; i++) {
    const k = j * Nx + i;
    if (maybeCut(i, j)) {
      let am = 0, v = 0;
      for (let b = 0; b < NC; b++) {
        const rc = j + (b + 0.5) / NC;
        for (let a = 0; a < NC; a++) if (fluid(i + (a + 0.5) / NC, rc)) { am += 1; v += rc; }
      }
      Am[k] = am / (NC * NC); V[k] = v / (NC * NC);
      isCut[k] = (Am[k] > 0 && Am[k] < 1) ? 1 : 0;
    } else if (fluid(i + 0.5, j + 0.5)) { Am[k] = 1; V[k] = j + 0.5; }
  }
  // faces (index on the (Nx+1) x (Nr+1) lattice)
  const W1 = Nx + 1;
  const Ax = new Float32Array(W1 * (Nr + 1)), Ar = new Float32Array(W1 * (Nr + 1));
  const cutAt = (i, j) => (i >= 0 && i < Nx && j >= 0 && j < Nr) ? isCut[j * Nx + i] : 0;
  for (let j = 0; j < Nr; j++) for (let i = 0; i <= Nx; i++) {         // x-faces at x = i
    let a;
    if (cut && (cutAt(i - 1, j) || cutAt(i, j) || maybeCut(Math.min(i, Nx - 1), j) || (i > 0 && maybeCut(i - 1, j)))) {
      a = 0;
      for (let b = 0; b < NF; b++) { const rc = j + (b + 0.5) / NF; if (fluid(i, rc)) a += rc; }
      a /= NF;
    } else a = fluid(i, j + 0.5) ? j + 0.5 : 0;
    Ax[j * W1 + i] = a;
  }
  for (let j = 0; j <= Nr; j++) for (let i = 0; i < Nx; i++) {         // r-faces at r = j
    let a;
    if (cut && (cutAt(i, j - 1) || cutAt(i, j) || (j < Nr && maybeCut(i, j)) || (j > 0 && maybeCut(i, j - 1)))) {
      let f = 0;
      for (let b = 0; b < NF; b++) if (fluid(i + (b + 0.5) / NF, j)) f++;
      a = j * f / NF;
    } else a = fluid(i + 0.5, j) ? j : 0;
    Ar[j * W1 + i] = a;
  }

  // ---------------- classification ----------------
  const solid = new Uint8Array(Nx * Nr);
  const kap = new Float32Array(Nx * Nr);
  for (let j = 0; j < Nr; j++) for (let i = 0; i < Nx; i++) {
    const k = j * Nx + i;
    kap[k] = V[k] / (j + 0.5);
    if (kap[k] < 0.02) solid[k] = 1;
  }
  const zeroSolidFaces = () => {
    for (let j = 0; j < Nr; j++) for (let i = 0; i < Nx; i++) {
      if (!solid[j * Nx + i]) continue;
      Ax[j * W1 + i] = 0; Ax[j * W1 + i + 1] = 0; Ar[j * W1 + i] = 0; Ar[(j + 1) * W1 + i] = 0;
    }
  };
  zeroSolidFaces();
  // merge slivers into a neighbour with kappa >= 0.5
  const host = new Int32Array(Nx * Nr).fill(-1);   // -1: own host
  const KMERGE = 0.5;
  for (let pass = 0; pass < 2; pass++) {
    for (let j = 0; j < Nr; j++) for (let i = 0; i < Nx; i++) {
      const k = j * Nx + i;
      if (solid[k] || kap[k] >= KMERGE || host[k] >= 0) continue;
      let best = -1, bestA = 0;
      const cand = [
        [i - 1, j, Ax[j * W1 + i] / (j + 0.5)], [i + 1, j, Ax[j * W1 + i + 1] / (j + 0.5)],
        [i, j - 1, j > 0 ? Ar[j * W1 + i] / j : 0], [i, j + 1, Ar[(j + 1) * W1 + i] / (j + 1)],
      ];
      for (const [ii, jj, a] of cand) {
        if (ii < 0 || ii >= Nx || jj < 0 || jj >= Nr) continue;
        const kk = jj * Nx + ii;
        if (solid[kk] || kap[kk] < KMERGE || host[kk] >= 0) continue;
        if (a > bestA + 1e-9) { bestA = a; best = kk; }
      }
      if (best >= 0 && bestA > 0.02) host[k] = best;
      else if (pass === 1) solid[k] = 1;
    }
  }
  zeroSolidFaces();
  // first-order flag for faces next to cut cells: store the area negated
  const ax = (i, j) => Ax[j * W1 + i], ar = (i, j) => Ar[j * W1 + i];
  const geoA = new Float32Array(W1 * (Nr + 1) * 4);
  const partial = (i, j) => (i >= 0 && i < Nx && j >= 0 && j < Nr) && !solid[j * Nx + i] && (kap[j * Nx + i] < 0.98 || host[j * Nx + i] >= 0);
  for (let j = 0; j <= Nr; j++) for (let i = 0; i <= Nx; i++) {
    const q = (j * W1 + i) * 4;
    if (i < Nx && j < Nr) { const k = j * Nx + i; geoA[q] = V[k]; geoA[q + 1] = Am[k]; }
    if (j < Nr) { const a = ax(i, j); geoA[q + 2] = (partial(i - 1, j) || partial(i, j)) ? -a : a; }
    if (i < Nx) { const a = ar(i, j); geoA[q + 3] = (partial(i, j - 1) || partial(i, j)) ? -a : a; }
  }
  // wall vectors (closure) and group sums
  const Wx = new Float32Array(Nx * Nr), Wr = new Float32Array(Nx * Nr);
  for (let j = 0; j < Nr; j++) for (let i = 0; i < Nx; i++) {
    const k = j * Nx + i;
    if (solid[k]) continue;
    Wx[k] = ax(i, j) - ax(i + 1, j);
    Wr[k] = Am[k] - (ar(i, j + 1) - ar(i, j));
    if (Math.abs(Wx[k]) < 1e-6) Wx[k] = 0;
    if (Math.abs(Wr[k]) < 1e-6) Wr[k] = 0;
  }
  const geoG = new Float32Array(Nx * Nr * 4), geoM = new Float32Array(Nx * Nr * 4);
  const gV = new Float32Array(Nx * Nr), gA = new Float32Array(Nx * Nr), gX = new Float32Array(Nx * Nr), gR = new Float32Array(Nx * Nr);
  const slaveMask = new Uint8Array(Nx * Nr);
  for (let k = 0; k < Nx * Nr; k++) if (!solid[k]) { const h = host[k] >= 0 ? host[k] : k; gV[h] += V[k]; gA[h] += Am[k]; gX[h] += Wx[k]; gR[h] += Wr[k]; }
  for (let j = 0; j < Nr; j++) for (let i = 0; i < Nx; i++) {
    const k = j * Nx + i;
    if (solid[k] || host[k] < 0) continue;
    const h = host[k], hi = h % Nx, hj = (h - hi) / Nx;
    const bit = i < hi ? 1 : i > hi ? 2 : j < hj ? 4 : 8;
    slaveMask[h] |= bit;
  }
  let nCut = 0, nMerged = 0;
  for (let j = 0; j < Nr; j++) for (let i = 0; i < Nx; i++) {
    const k = j * Nx + i, q = k * 4;
    if (solid[k]) { geoG[q] = 1; continue; }
    const h = host[k] >= 0 ? host[k] : k, hi = h % Nx, hj = (h - hi) / Nx;
    geoG[q] = gV[h]; geoG[q + 1] = gA[h]; geoG[q + 2] = gX[h]; geoG[q + 3] = gR[h];
    geoM[q] = hi - i; geoM[q + 1] = hj - j; geoM[q + 2] = slaveMask[k]; geoM[q + 3] = kap[k];
    if (kap[k] < 0.98) nCut++;
    if (host[k] >= 0) nMerged++;
  }
  return { mask: solid, geoA, geoG, geoM, Ax, Ar, W1, kappa: kap, nCut, nMerged };
}

// ===== solver.js =====
// ============================================================================
// solver.js — WebGL2 GPU solver for the 2-D axisymmetric compressible Euler
// equations + a passive exhaust scalar.
//   * Finite volume, uniform square cells (dx = dr = 1 in grid units)
//   * MUSCL reconstruction of primitives (van Leer limiter)
//   * HLLC Riemann solver, blended to HLL near strong shocks (anti-carbuncle)
//   * SSP-RK2 (Heun) time stepping, CFL time step computed on the GPU
//   * Staircase solid walls via mirror ghost states
// State textures (RGBA32F): A = (rho, rho*u, rho*v, E), B = (rho*Y, 0, 0, 0)
// All quantities are normalised: p/P_REF, rho/RHO_REF, u/U_REF.
// ============================================================================
'use strict';

const GLSL_COMMON = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform ivec2 uN;          // Nx, Nr
uniform float uGamma;
uniform sampler2D uMask;   // r > 0.5 : solid
const float RHO_MIN = 1e-7;
const float P_MIN   = 1e-7;
struct Prim { vec4 w; float y; };   // w = (rho, u, v, p)

bool solidAt(ivec2 c) { return texelFetch(uMask, c, 0).r > 0.5; }

Prim toPrim(vec4 a, float b) {
  float rho = max(a.x, RHO_MIN);
  vec2 vel = a.yz / rho;
  float p = max((uGamma - 1.0) * (a.w - 0.5 * rho * dot(vel, vel)), P_MIN);
  return Prim(vec4(rho, vel, p), clamp(b / rho, 0.0, 1.0));
}
`;

const VS_QUAD = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// ---------------------------------------------------------------------------
// Primitive pass: writes a PADDED texture of size (Nx+4) x (Nr+4) holding the
// primitive state (rho,u,v,p) of every cell plus a 2-cell halo of boundary
// ghost cells (stagnation inlet, far field, outflow, axis mirror). Wall cells
// are flagged with rho < 0. All boundary branching lives here, once per cell,
// which keeps the flux shaders small and quick to compile.
// ---------------------------------------------------------------------------
const FS_PRIM = GLSL_COMMON + `
uniform sampler2D uA; uniform sampler2D uB;
uniform sampler2D uStep;    // (dt, t_old, t_new, wmax)
uniform int uTimeSel;       // 1 -> t_old, 2 -> t_new
uniform vec4 uAmb;          // freestream primitive (rho, u, v, p), Y = 0
uniform vec3 uRes;          // reservoir: (P0 target, T0 normalised, R_exhaust normalised)
uniform float uPambStart;   // pressure at which the ignition ramp starts
uniform float uRamp;        // ramp duration (grid time units); <= 0 -> instant
uniform float uRcCells;     // chamber radius in cells (reservoir rows)
layout(location = 0) out vec4 oW;
layout(location = 1) out vec4 oWb;
Prim interior(ivec2 c) { return toPrim(texelFetch(uA, c, 0), texelFetch(uB, c, 0).r); }
void main() {
  ivec2 P = ivec2(gl_FragCoord.xy) - 2;
  int i = P.x, j = P.y, Nx = uN.x, Nr = uN.y;
  bool mir = j < 0;
  if (mir) j = -j - 1;
  Prim q = Prim(uAmb, 0.0);
  bool wall = false;
  if (i < 0) {
    // left boundary: injector face (stagnation inlet) / chamber wall / free stream
    if (j < Nr && solidAt(ivec2(0, j))) wall = true;
    else if (float(j) + 0.5 < uRcCells) {
      vec4 st = texelFetch(uStep, ivec2(0), 0);
      float t = uTimeSel == 1 ? st.y : st.z;
      float f = uRamp > 0.0 ? smoothstep(0.0, uRamp, t) : 1.0;
      float P0 = mix(uPambStart, uRes.x, f);
      float T0 = uRes.y, R = uRes.z, g = uGamma;
      vec4 a = texelFetch(uA, ivec2(0, j), 0);
      float u = clamp(a.y / max(a.x, RHO_MIN), 0.0, 0.5 * sqrt(g * R * T0));
      float T = T0 - u * u * (g - 1.0) / (2.0 * g * R);
      float p = P0 * pow(T / T0, g / (g - 1.0));
      q = Prim(vec4(p / (R * T), u, 0.0, p), 1.0);
    }
  } else if (j >= Nr) {
    // top: pressure far field
    ivec2 c = ivec2(min(i, Nx - 1), Nr - 1);
    if (!solidAt(c)) {
      Prim t = interior(c);
      float cs = sqrt(uGamma * t.w.w / t.w.x);
      if (t.w.z >= cs) q = t;
      else if (t.w.z > 0.0) { q = t; q.w.w = uAmb.w; }
    }
  } else if (i >= Nx) {
    // right: supersonic / subsonic outflow
    ivec2 c = ivec2(Nx - 1, j);
    if (!solidAt(c)) {
      Prim t = interior(c);
      float cs = sqrt(uGamma * t.w.w / t.w.x);
      if (t.w.y >= cs) q = t;
      else if (t.w.y > 0.0) { q = t; q.w.w = uAmb.w; }
      else q.w.y = max(q.w.y, 0.0);
    }
  } else {
    if (solidAt(ivec2(i, j))) wall = true; else q = interior(ivec2(i, j));
  }
  if (wall) { oW = vec4(-1.0, 0.0, 0.0, 1.0); oWb = vec4(0.0); return; }
  if (mir) q.w.z = -q.w.z;           // axis of symmetry
  oW = q.w; oWb = vec4(q.y, 0.0, 0.0, 0.0);
}
`;

// ---------------------------------------------------------------------------
// Flux passes (one small program per direction).
//   x-pass: pixel (i,j) of an (Nx+1) x Nr target -> flux through the WEST face of cell (i,j)
//   r-pass: pixel (i,j) of an Nx x (Nr+1) target -> flux through the SOUTH face of cell (i,j)
// ---------------------------------------------------------------------------
function makeFluxShader(dirR) { return GLSL_COMMON + `
#define DIR_R ${dirR ? 1 : 0}
uniform sampler2D uGeoA;    // (V, Am, Ax_west, Ar_south); negative area => first order
uniform sampler2D uW;       // padded primitive (rho, u, v, p); rho < 0 marks a wall cell
uniform sampler2D uWb;      // padded (Y, 0, 0, 0)
uniform float uLimiter;     // 0 = first order, 1 = second order
uniform float uHllBlend;    // sensitivity of HLL blending (0 disables)
layout(location = 0) out vec4 oF;
layout(location = 1) out vec4 oFY;

Prim cellP(int i, int j, out bool s) {
  ivec2 c = ivec2(i + 2, j + 2);
  vec4 w = texelFetch(uW, c, 0);
  s = w.x < 0.0;
  Prim q = Prim(w, texelFetch(uWb, c, 0).r);
#if DIR_R
  q.w.yz = q.w.zy;          // face-normal frame: normal velocity in .y
#endif
  return q;
}
float pAt(int i, int j, float fb) { vec4 w = texelFetch(uW, ivec2(i + 2, j + 2), 0); return w.x < 0.0 ? fb : w.w; }
Prim mirrorN(Prim q) { q.w.y = -q.w.y; return q; }
vec4 vanLeer(vec4 a, vec4 b) {
  vec4 ab = a * b, den = a + b;
  den = mix(den, vec4(1.0), step(abs(den), vec4(1e-30)));
  return 2.0 * max(ab, vec4(0.0)) / den;
}
float vanLeer1(float a, float b) { float ab = a * b; return ab > 0.0 ? 2.0 * ab / (a + b) : 0.0; }
float jumpRatio(float a, float b) { return abs(a - b) / min(a, b); }

void main() {
  ivec2 ij = ivec2(gl_FragCoord.xy);
  int i = ij.x, j = ij.y;
  oF = vec4(0.0); oFY = vec4(0.0);
  vec4 geo = texelFetch(uGeoA, ij, 0);
#if DIR_R
  float area = geo.w;
  if (j == 0 || area == 0.0) return;
  ivec2 d = ivec2(0, 1), t = ivec2(1, 0);
#else
  float area = geo.z;
  if (area == 0.0) return;

#endif
  bool s0, s1, s2, s3;

  Prim c0 = cellP(k0.x, k0.y, s0), c1 = cellP(k1.x, k1.y, s1);
  Prim c2 = cellP(i, j, s2), c3 = cellP(k3.x, k3.y, s3);
  if (s1 && s2) return;

  if (uHllBlend > 0.0 && !(s1 || s2)) {
    float p1 = c1.w.w, p2 = c2.w.w;

      const stepTex = this.stepTex[this.stepIdx];
      // ---- RK stage 1:  S1 = S0 + dt L(S0)
      this._fluxPass(S0, stepTex, 1, P);
      this._updatePass(S0, S0, stepTex, 1, S1, P);
      // ---- RK stage 2:  S2 = 0.5 (S0 + S1 + dt L(S1))
      this._fluxPass(S1, stepTex, 2, P);

  _fluxPass(S, stepTex, timeSel, P) {

  _updatePass(S, S0, stepTex, stage, out, P) {

  rescaleAmbient(fp, fT, du, P) {

  get state() { return this.S[this.cur]; }
  get stepInfoTex() { return this.stepTex[this.stepIdx]; }

  // ---- read-back helpers (synchronous; call sparingly)
  _readRect(tex, x, y, w, h) {

  requestAsync(reqs, tag) {
    const gl = this.gl;

    let floats = 0;
    const offs = reqs.map(r => { const o = floats; floats += r.w * r.h * 4; return o; });
    const pbo = gl.createBuffer();          // fresh buffer per read keeps the browser's fast read-back path
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
    gl.bufferData(gl.PIXEL_PACK_BUFFER, floats * 4, gl.STREAM_READ);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.readFbo);
    reqs.forEach((r, k) => {
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, r.tex, 0);
      gl.readBuffer(gl.COLOR_ATTACHMENT0);
      gl.readPixels(r.x, r.y, r.w, r.h, gl.RGBA, gl.FLOAT, offs[k] * 4);
    });
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    const fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    gl.flush();

  }
  // Returns { tag, data: { name: Float32Array } } once the GPU has finished, else null.
  pollAsync() {

    const st = gl.getSyncParameter(a.fence, gl.SYNC_STATUS);
    if (st !== gl.SIGNALED) return null;
    gl.deleteSync(a.fence);
    const all = new Float32Array(a.floats);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, a.pbo);
    gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, all);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    gl.deleteBuffer(a.pbo);
    this._async = null;
    const data = {};
    a.reqs.forEach((r, k) => { data[r.name] = all.subarray(a.offs[k], a.offs[k] + r.w * r.h * 4); });
    return { tag: a.tag, data, probe: a.probe };
  }
  cancelAsync() {
    if (!this._async) return;
    try { this.gl.deleteSync(this._async.fence); this.gl.deleteBuffer(this._async.pbo); } catch (e) {}
    this._async = null;
  }

  readStepInfo() { return this._readRect(this.stepInfoTex, 0, 0, 1, 1); }
  readColumn(i) { return { A: this._readRect(this.state.A, i, 0, 1, this.Nr), B: this._readRect(this.state.B, i, 0, 1, this.Nr) }; }
  readCell(i, j) { return { A: this._readRect(this.state.A, i, j, 1, 1), B: this._readRect(this.state.B, i, j, 1, 1) }; }
  readAll() { return { A: this._readRect(this.state.A, 0, 0, this.Nx, this.Nr), B: this._readRect(this.state.B, 0, 0, this.Nx, this.Nr) }; }
}

// ===== simsetup.js =====
// ============================================================================
// simsetup.js — turns user-facing engine parameters into a grid, wall mask,
// initial condition and the normalised parameter block used by the solver.
// ============================================================================
'use strict';

function buildSimSetup(cfg) {
  // cfg (SI): Dt, De, type, bellPct, coneAngle, CR, chamberLen, Pc, Tc, gamma, Mw,
  //           alt (m), mach, base (bool), bodyRatio, domainL (m), Nx, aspect, startMode, rampMs
  const Nx = cfg.Nx;
  const Nr = Math.max(16, Math.round(Nx * cfg.aspect));
  const contour = buildContour(cfg);
  // Snap the cell size so the throat radius is a whole number of cells: the
  // stepped wall then reproduces the true throat area (and hence mass flow).
  // On a live re-mesh the existing spacing is kept (cfg.dx).
  let dx = cfg.domainL / Nx;
  if (cfg.dx) dx = cfg.dx;
  else { const nt = Math.max(3, Math.round(contour.Rt / dx)); dx = contour.Rt / nt; }
  const atm = atmosphere(cfg.alt);
  const g = cfg.gamma;
  const Re_gas = RU / cfg.Mw;
  const theory = nozzleTheory({ Pc: cfg.Pc, Tc: cfg.Tc, gamma: g, Mw: cfg.Mw, Dt: cfg.Dt, De: cfg.De, pa: atm.p });

  // ---------------- wall mask ----------------
  const tw = Math.max(2.6 * dx, 0.12 * contour.Rt);
  const bodyR = cfg.base ? Math.max(contour.Rc, contour.Re) * (cfg.bodyRatio || 1.5) + tw : 0;
  const xBase = contour.xt;
  const RinCol = new Float32Array(Nx);
  for (let i = 0; i < Nx; i++) {
    const x = (i + 0.5) * dx;
    RinCol[i] = x <= contour.xe ? contour.radiusAt(x) : Infinity;
  }
  const geo = buildCutGeometry({ Nx, Nr, dx, contour, tw, base: cfg.base, xBase, bodyR, mode: cfg.wallModel || 'cut' });
  const mask = geo.mask;

  // ---------------- normalised parameters ----------------
  const tScale = dx / U_REF;                    // seconds per grid time unit
  const P = computeParams(cfg, contour, dx, cfg.Pc, atm.p);
  const pa = P.amb[3], rhoa = P.amb[0];
  const ReN = P.ReN, TcN = P.res[1], PcN = P.res[0];

  // ---------------- initial condition ----------------
  function initialState() {
    const A = new Float32Array(Nx * Nr * 4), B = new Float32Array(Nx * Nr * 4);
    const rho0 = PcN / (ReN * TcN);
    const E0 = PcN / (g - 1);
    for (let j = 0; j < Nr; j++) {
      const r = (j + 0.5) * dx;
      for (let i = 0; i < Nx; i++) {
        const x = (i + 0.5) * dx, k = (j * Nx + i) * 4;
        const inNozzle = x <= contour.xe && r < RinCol[i];
        if (cfg.startMode === 'burst' && inNozzle && x < contour.xt) {
          A[k] = rho0; A[k + 1] = 0; A[k + 2] = 0; A[k + 3] = E0; B[k] = rho0;
        } else if (inNozzle) {
          A[k] = rhoa; A[k + 1] = 0; A[k + 2] = 0; A[k + 3] = pa / (g - 1);
        } else {
          A[k] = P.ambCons[0]; A[k + 1] = P.ambCons[1]; A[k + 2] = 0; A[k + 3] = P.ambCons[3];
        }
      }
    }
    // merged sliver cells carry their host's state
    for (let k = 0; k < Nx * Nr; k++) {
      const q = k * 4, hx = geo.geoM[q], hy = geo.geoM[q + 1];
      if (mask[k] || (hx === 0 && hy === 0)) continue;
      const h = (k + hy * Nx + hx) * 4;
      for (let c = 0; c < 4; c++) { A[q + c] = A[h + c]; B[q + c] = B[h + c]; }
    }
    return { A, B };
  }

  const iExit = Math.max(1, Math.min(Nx - 1, Math.floor(contour.xe / dx) - 1));
  let jExit = 0;
  while (jExit < Nr && !mask[jExit * Nx + iExit]) jExit++;
  const iChamber = Math.max(1, Math.floor(0.5 * contour.Lc / dx));
  const iThroat = Math.floor(contour.xt / dx);

  return {
    cfg, Nx, Nr, dx, tw, bodyR, xBase, contour, atm, theory, mask, geo, P, initialState,
    iExit, jExit, iChamber, iThroat, tScale,
    resolution: { throatCells: contour.Rt / dx, exitCells: contour.Re / dx },
  };
}

// Normalised solver parameters. 'live' quantities (Pc, Tc, Mw, alt, mach) may
// change every frame; pStartSi is the ambient pressure at ignition.
function computeParams(cfg, contour, dx, PcSi, pStartSi) {
  const g = cfg.gamma;
  const atm = atmosphere(cfg.alt);
  const pa = atm.p / P_REF;
  const rhoa = pa / (atm.T / T_REF);           // R_air normalised = 1
  const ca = Math.sqrt(g * pa / rhoa);
  const uinf = cfg.mach * ca;
  const ReN = (RU / cfg.Mw) / R_REF;
  const TcN = cfg.Tc / T_REF;
  const PcN = PcSi / P_REF;
  const c0 = Math.sqrt(g * ReN * TcN);
  const uLim = Math.sqrt(2 * g / (g - 1) * ReN * TcN);
  const tScale = dx / U_REF;
  return {
    gamma: g,
    amb: [rhoa, uinf, 0, pa],
    ambCons: [rhoa, rhoa * uinf, 0, pa / (g - 1) + 0.5 * rhoa * uinf * uinf],
    res: [PcN, TcN, ReN],
    pStart: Math.min(pStartSi / P_REF, PcN),
    ramp: cfg.startMode === 'burst' ? 0 : (cfg.rampMs * 1e-3) / tScale,
    RcCells: contour.Rc / dx,
    cfl: cfg.cfl || 0.6,
    dtMax: 10.0,
    wFloor: 2.0 * c0 + Math.abs(uinf),
    vMax: 3.0 * (uLim + c0 + Math.abs(uinf) + ca),
    hllBlend: cfg.hllBlend === undefined ? 1.0 : cfg.hllBlend,
    order2: cfg.order2 === undefined ? true : cfg.order2,
    ReN, RaN: 1.0, Ta: atm.T, pa: atm.p, uinf, uLimN: uLim,
  };
}

// Convert a column read-back into exit-plane performance numbers (SI)
function exitPerformance(setup, col) {
  const { Nr, dx, P } = setup, g = P.gamma;
  let F = 0, mdot = 0, Mw = 0, pw = 0, A = 0;
  for (let j = 0; j < setup.jExit; j++) {
    const k = j * 4;
    const rho = Math.max(col.A[k], 1e-9), u = col.A[k + 1] / rho, v = col.A[k + 2] / rho;
    const p = Math.max((g - 1) * (col.A[k + 3] - 0.5 * rho * (u * u + v * v)), 1e-9);
    const dA = setup.geo ? 2 * Math.PI * Math.abs(setup.geo.Ax[j * setup.geo.W1 + setup.iExit + 1]) * dx * dx : 2 * Math.PI * (j + 0.5) * dx * dx;
    const c = Math.sqrt(g * p / rho);
    const m = rho * u * dA;
    F += (rho * u * u + p - P.amb[3]) * dA;
    mdot += m;
    Mw += m * Math.sqrt(u * u + v * v) / c;
    pw += p * dA; A += dA;
  }
  const Fsi = F * P_REF;                          // rho_hat*u_hat^2 has units of P_REF
  const mdotSi = mdot * RHO_REF * U_REF;
  return {
    F: Fsi, mdot: mdotSi, Me: mdot > 1e-12 ? Mw / mdot : 0,
    pe: (A > 0 ? pw / A : 0) * P_REF,
    Isp: mdotSi > 1e-9 ? Fsi / (mdotSi * G0) : 0,
  };
}
function cellPrimSI(setup, a, b) {
  const g = setup.P.gamma;
  const rho = Math.max(a[0], 1e-9), u = a[1] / rho, v = a[2] / rho;
  const p = Math.max((g - 1) * (a[3] - 0.5 * rho * (u * u + v * v)), 1e-9);
  const Y = Math.min(Math.max(b[0] / rho, 0), 1);
  const Rmix = Y * setup.P.ReN + (1 - Y) * setup.P.RaN;
  const T = p / (rho * Rmix) * T_REF;
  const c = Math.sqrt(g * p / rho);
  return { rho: rho * RHO_REF, u: u * U_REF, v: v * U_REF, p: p * P_REF, T, Y, M: Math.hypot(u, v) / c };
}

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; }

  const d = new Uint8Array(256 * 4);

    const t = k / 255;

    else {
      const s = cm.stops;
      let a = 0; while (a < s.length - 2 && t > s[a + 1][0]) a++;
      const u = Math.min(1, Math.max(0, (t - s[a][0]) / (s[a + 1][0] - s[a][0])));
      const c0 = hexToRgb(s[a][1]), c1 = hexToRgb(s[a + 1][1]);
      const sm = u * u * (3 - 2 * u) * 0.35 + u * 0.65;
      c = c0.map((v, q) => v + (c1[q] - v) * sm);
    }
    for (let q = 0; q < 3; q++) d[k * 4 + q] = Math.round(255 * Math.min(1, Math.max(0, c[q])));
    d[k * 4 + 3] = 255;

const FS_DERIVED = GLSL_COMMON + `

uniform int uField;
uniform vec2 uRange;          // display range (after log, if any)
uniform float uReN, uRaN;     // normalised gas constants
uniform vec4 uTscale;         // (T_REF, Tc_K, Ta_K, unused)
uniform float uSchlGain;

uniform float uDx;            // cell size (m)

    float lw = solidAt(clamp(ij - ivec2(1,0), ivec2(0), uN-1)) ? l0 : lrho(ij - ivec2(1, 0));
    float ln = solidAt(clamp(ij + ivec2(0,1), ivec2(0), uN-1)) ? l0 : lrho(ij + ivec2(0, 1));

    Prim s = Prim(vec4(q.w.x, q.w.y, -q.w.z, q.w.w), q.y);

const FS_DISPLAY = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uD;        // derived field (t, Y, Tn, M), a = -1 in walls
uniform sampler2D uD2;       // second field for split view (lower half)
uniform int uSplit;
uniform int uField2;
uniform sampler2D uLUT;
uniform sampler2D uLUT2;     // flame colormap
uniform ivec2 uN;
uniform vec4 uView;          // x0, y0, xw, yh (cells; y signed, r = |y|)
uniform int uField;
uniform int uMirror;
uniform int uSonic;          // 0 none, 1 sonic line, 2 Mach contours
uniform vec3 uBg;
uniform float uFlameGain;
out vec4 o;
bool lowerHalf = false;
vec4 fetchD(ivec2 c) {
  c.x = clamp(c.x, 0, uN.x - 1);
  if (c.y < 0) c.y = -c.y - 1;
  c.y = min(c.y, uN.y - 1);
  return lowerHalf ? texelFetch(uD2, c, 0) : texelFetch(uD, c, 0);
}
void main() {
  float x = uView.x + vUv.x * uView.z;

  float r = abs(y);
  if (x < 0.0 || x > float(uN.x) || r > float(uN.y) || (uMirror == 0 && y < 0.0)) { o = vec4(uBg * 0.6, 1.0); return; }
  lowerHalf = uSplit == 1 && y < 0.0;

  float w10 = f.x * (1.0 - f.y) * step(-0.5, d10.w);
  float w01 = (1.0 - f.x) * f.y * step(-0.5, d01.w);
  float w11 = f.x * f.y * step(-0.5, d11.w);
  float ws = w00 + w10 + w01 + w11;

    float Tn = clamp(d.z, 0.0, 1.2);
    float Y = clamp(d.y, 0.0, 1.0);
    float tn = clamp(Tn, 0.0, 1.0);
    float em = pow(Y, 0.6) * (0.07 + 1.15 * pow(tn, 1.35)) * uFlameGain;
    vec3 fc = texture(uLUT2, vec2(clamp(0.22 + 0.78 * sqrt(tn), 0.0, 1.0), 0.5)).rgb;
    col = uBg + fc * em;

      line = max(line, 1.0 - smoothstep(0.6, 1.6, abs(M - 1.0) / fw));

  o = vec4(col, 1.0);
}
`;

// ---------------------------------------------------------------------------
// Particles: state texture (x, r, age, seed); advected with the local velocity
// ---------------------------------------------------------------------------
const FS_PART_ADVECT = GLSL_COMMON + `
uniform sampler2D uP;         // particle state
uniform sampler2D uA;
uniform float uDt;            // grid-time advanced since last frame
uniform float uFrame;
uniform vec4 uSpawn;          // chamber length (cells), Rc (cells), exhaust spawn share, maxAge
out vec4 o;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 vel(vec2 pos) {
  ivec2 c = ivec2(clamp(pos, vec2(0.0), vec2(uN) - 1.0));
  if (solidAt(c)) return vec2(0.0);
  vec4 a = texelFetch(uA, c, 0);
  return a.yz / max(a.x, 1e-7);
}
void main() {
  ivec2 ij = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(uP, ij, 0);
  vec2 pos = s.xy;
  float age = s.z + 1.0;
  // RK2 advection in grid units
  vec2 v1 = vel(pos);
  vec2 mid = pos + 0.5 * uDt * v1;
  mid.y = abs(mid.y);
  vec2 v2 = vel(mid);
  pos += uDt * v2;
  pos.y = abs(pos.y);
  bool dead = age > uSpawn.w || pos.x < 0.0 || pos.x >= float(uN.x) || pos.y >= float(uN.y)
           || solidAt(ivec2(clamp(pos, vec2(0.0), vec2(uN) - 1.0)));

    float h1 = hash(vec2(ij) + uFrame * 0.731), h2 = hash(vec2(ij).yx * 1.37 + uFrame * 0.129);
    float h3 = hash(vec2(ij) * 0.77 + uFrame * 1.913);

    else pos = vec2(h1 * float(uN.x), sqrt(h2) * float(uN.y));

  }
  float sgn = s.w == 0.0 ? (hash(vec2(ij) * 9.1) < 0.5 ? -1.0 : 1.0) : sign(s.w);
  o = vec4(pos, age, sgn * (1.0 + min(length(v2), 1e4)));

`;
const VS_PART = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uP;
uniform ivec2 uPN;
uniform vec4 uView;
uniform int uMirror;
uniform float uSize;
uniform float uMaxAge;
uniform vec2 uSpd;
out float vA;
void main() {
  ivec2 c = ivec2(gl_VertexID % uPN.x, gl_VertexID / uPN.x);
  vec4 s = texelFetch(uP, c, 0);
  float y = s.y * (uMirror == 1 ? sign(s.w) : 1.0);
  float spd = abs(s.w) - 1.0;
  vec2 uv = vec2((s.x - uView.x) / uView.z, (y - uView.y) / uView.w);
  gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = uSize;
  float a = s.z / uMaxAge;
  vA = smoothstep(0.0, 0.08, a) * (1.0 - smoothstep(0.75, 1.0, a)) * (0.08 + 0.92 * smoothstep(uSpd.x, uSpd.y, spd));
  if (s.w == 0.0) vA = 0.0;
}
`;
const FS_PART = `#version 300 es
precision highp float;
in float vA;
uniform vec3 uColor;
out vec4 o;
void main() {
  vec2 d = gl_PointCoord - 0.5;
  float m = 1.0 - smoothstep(0.2, 0.5, length(d));
  o = vec4(uColor * m * vA, 1.0);
}
`;


// ---------------------------------------------------------------------------
// Glow (bloom) post-process
// ---------------------------------------------------------------------------
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uS; uniform vec2 uTexel; uniform float uThr;
out vec4 o;
void main() {
  vec3 c = vec3(0.0);
  c += texture(uS, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
  c += texture(uS, vUv + uTexel * vec2( 1.0, -1.0)).rgb;
  c += texture(uS, vUv + uTexel * vec2(-1.0,  1.0)).rgb;
  c += texture(uS, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
  c *= 0.25;
  float l = max(c.r, max(c.g, c.b));
  o = vec4(c * smoothstep(uThr, uThr + 0.35, l), 1.0);
}
`;
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uS; uniform vec2 uDir;
out vec4 o;
void main() {
  vec3 c = texture(uS, vUv).rgb * 0.2270270;
  c += texture(uS, vUv + uDir * 1.3846154).rgb * 0.3162162;
  c += texture(uS, vUv - uDir * 1.3846154).rgb * 0.3162162;
  c += texture(uS, vUv + uDir * 3.2307692).rgb * 0.0702703;
  c += texture(uS, vUv - uDir * 3.2307692).rgb * 0.0702703;
  o = vec4(c, 1.0);

`;
const FS_COMBINE = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uS; uniform sampler2D uB1; uniform sampler2D uB2; uniform float uK;
out vec4 o;
void main() {
  vec3 c = texture(uS, vUv).rgb + uK * (0.6 * texture(uB1, vUv).rgb + 0.9 * texture(uB2, vUv).rgb);
  // soft shoulder above 0.8 only, so unbloomed colours are untouched
  vec3 hi = 0.8 + 0.2 * (1.0 - exp(-(c - 0.8) / 0.2));

`;

class Renderer {
  constructor(gl, solver) {
    this.gl = gl; this.solver = solver;
    this.progDerived = solver._program(VS_QUAD, FS_DERIVED);
    this.progDisplay = solver._program(VS_QUAD, FS_DISPLAY);
    this.progAdvect = solver._program(VS_QUAD, FS_PART_ADVECT);
    this.progPart = solver._program(VS_PART, FS_PART);
    this.lut = this._lutTex(); this.lut2 = this._lutTex();
    this.setColormap('plasma');
    this._setLut(this.lut2, COLORMAPS.flame);

    this.frame = 0;
    this.progBright = solver._program(VS_QUAD, FS_BRIGHT);
    this.progBlur = solver._program(VS_QUAD, FS_BLUR);
    this.progCombine = solver._program(VS_QUAD, FS_COMBINE);

  }
  _rt(w, h) {

    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { t, f, w, h };
  }
  _ensurePost(W, H) {
    const gl = this.gl;
    if (this.post && this.post.W === W && this.post.H === H) return;
    if (this.post) for (const r of this.post.all) { gl.deleteTexture(r.t); gl.deleteFramebuffer(r.f); }
    const w2 = Math.max(1, W >> 2), h2 = Math.max(1, H >> 2), w3 = Math.max(1, W >> 3), h3 = Math.max(1, H >> 3);
    const scene = this._rt(W, H), a = this._rt(w2, h2), b = this._rt(w2, h2), c = this._rt(w3, h3), d = this._rt(w3, h3);
    this.post = { W, H, scene, a, b, c, d, all: [scene, a, b, c, d] };
  }
  _pass(prog, target, binds, uni) {
    const gl = this.gl, s = this.solver;
    gl.useProgram(prog.p);
    let unit = 0;
    for (const [name, tex] of binds) s._bindTex(prog, name, tex, unit++);
    uni && uni(prog);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null);
    gl.viewport(0, 0, target ? target.w : this.post.W, target ? target.h : this.post.H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  _lutTex() {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  _setLut(tex, cm) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 256, 1, gl.RGBA, gl.UNSIGNED_BYTE, lutData(cm));
  }
  setColormap(id) { this._setLut(this.lut, COLORMAPS[id] || COLORMAPS.plasma); this.cmap = id; }

  resize(Nx, Nr) {
    const gl = this.gl, s = this.solver;
    if (this.derived) { gl.deleteTexture(this.derived); gl.deleteFramebuffer(this.derivedFbo); }
    if (this.derived2) { gl.deleteTexture(this.derived2); gl.deleteFramebuffer(this.derivedFbo2); }
    this.derived = s._tex(Nx, Nr, gl.RGBA32F, gl.RGBA, gl.FLOAT);
    this.derivedFbo = s._fbo([this.derived]);
    this.derived2 = s._tex(Nx, Nr, gl.RGBA32F, gl.RGBA, gl.FLOAT);
    this.derivedFbo2 = s._fbo([this.derived2]);
    if (!this.pTex) {
      this.pTex = [0, 1].map(() => s._tex(this.PN[0], this.PN[1], gl.RGBA32F, gl.RGBA, gl.FLOAT));
      this.pFbo = this.pTex.map(t => s._fbo([t]));

  }
  resetParticles() {

  }

  // V: view/display parameters from the app
  derive(V, second = false) {

  }

  display(V, width, height) {
    const gl = this.gl, s = this.solver, pr = this.progDisplay;
    gl.bindVertexArray(s.vao);
    if (V.glow) { this._ensurePost(width, height); gl.bindFramebuffer(gl.FRAMEBUFFER, this.post.scene.f); }
    else gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.disable(gl.BLEND);
    gl.useProgram(pr.p);

    s._bindTex(pr, 'uD2', V.split ? this.derived2 : this.derived, 3);
    gl.uniform1i(pr.u.uSplit, V.split ? 1 : 0);
    gl.uniform1i(pr.u.uField2, V.fieldIndex2);
    gl.uniform2i(pr.u.uN, s.Nx, s.Nr);
    gl.uniform4fv(pr.u.uView, V.view);
    gl.uniform1i(pr.u.uField, V.fieldIndex);
    gl.uniform1i(pr.u.uMirror, V.mirror ? 1 : 0);
    gl.uniform1i(pr.u.uSonic, V.sonic);
    gl.uniform3fv(pr.u.uBg, V.bg);
    gl.uniform1f(pr.u.uFlameGain, V.flameGain);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

      const pp = this.progPart;
      if (!this.emptyVao) this.emptyVao = gl.createVertexArray();
      gl.bindVertexArray(this.emptyVao);
      gl.useProgram(pp.p);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);

      gl.uniform2i(pp.u.uPN, this.PN[0], this.PN[1]);
      gl.uniform4fv(pp.u.uView, V.view);
      gl.uniform1i(pp.u.uMirror, V.mirror ? 1 : 0);
      gl.uniform1f(pp.u.uSize, V.particleSize);
      gl.uniform1f(pp.u.uMaxAge, V.particleAge);
      gl.uniform2f(pp.u.uSpd, V.spdRef * 0.04, V.spdRef * 0.4);

      gl.bindVertexArray(s.vao);

      this._pass(this.progBlur, P.a, [['uS', P.b.t]], pr => gl.uniform2f(pr.u.uDir, 0, 1 / P.a.h));

      this._pass(this.progBlur, P.d, [['uS', P.c.t]], pr => gl.uniform2f(pr.u.uDir, 2 / P.c.w, 0));
      this._pass(this.progBlur, P.c, [['uS', P.d.t]], pr => gl.uniform2f(pr.u.uDir, 0, 2 / P.c.h));

  }
}

    budget = 2; setup = null; perf = null;

let contextLost = false, lossCount = 0, restoreTimer = null, gpuName = '';

function cfgFromS() {

    Dt: S.Dt / 1000, De: Math.max(S.De, S.Dt * 1.02) / 1000, type: S.type, bellPct: S.bellPct, coneAngle: S.coneAngle,
    CR: S.CR, chamberLen: S.chamberLen, Pc: S.Pc * 1e5 * S.throttle / 100, Tc: S.Tc, gamma: S.gamma, Mw: S.Mw,
    alt: S.alt * 1000, mach: S.mach, base: S.base, bodyRatio: S.bodyRatio, domainL: S.domainL, Nx: S.res,

}
function liveTargets() {

}
let theoryCache = null;
function theoryNow() {
  const t = liveTargets();
  theoryCache = nozzleTheory({ Pc: t.Pc, Tc: t.Tc, gamma: S.gamma, Mw: t.Mw, Dt: S.Dt / 1000, De: Math.max(S.De, S.Dt * 1.02) / 1000, pa: atmosphere(t.alt).p });
  return theoryCache;
}

function restart() {
  if (!solver) return;
  const cfg = cfgFromS();
  const newSetup = buildSimSetup(cfg);
  const gridChanged = !setup || setup.Nx !== newSetup.Nx || setup.Nr !== newSetup.Nr;
  setup = newSetup;
  try {
    if (gridChanged) { solver.resize(setup.Nx, setup.Nr); renderer.resize(setup.Nx, setup.Nr); }
  } catch (e) { showMsg('<b>Grid too large for this GPU.</b><br>' + e.message); return; }
  solver.setGeometry(setup.geo);
  const init = setup.initialState();
  solver.setState(init.A, init.B);
  renderer.resetParticles();
  pStartSi = setup.atm.p;
  live = liveTargets();
  P = setup.P;
  stepsTotal = 0; simTime = 0; perf = null; chamber = null; lastReadT = -1; axisData = null; readGen++; probeData = null; budget = Math.max(2, Math.min(budget, 6));
  if (gridChanged || !view.fitted) fitView();

}
let geoTimer = null;
function remesh() {
  clearTimeout(geoTimer);
  geoTimer = setTimeout(() => {
    if (!setup) return;
    const cfg = cfgFromS();
    cfg.dx = setup.dx;                 // keep the grid so the flow can carry on
    const ns = buildSimSetup(cfg);
    if (ns.Nx !== setup.Nx || ns.Nr !== setup.Nr) { restart(); return; }
    setup = ns;
    solver.setGeometry(setup.geo);
    refreshHints();
  }, 40);
}
let resetTimer = null;
function restartSoon() { clearTimeout(resetTimer); resetTimer = setTimeout(restart, 150); }

function fitDomain() {
  const c = buildContour(cfgFromS());
  const t = theoryNow();
  // plume length scales with exit diameter and how under-expanded it is
  const plume = 2 * c.Re * Math.max(6, Math.min(16, 6 + 2.5 * Math.log10(Math.max(t.ratio, 1)) * 3));
  S.domainL = Math.round(Math.min(8, Math.max(0.1, (c.xe + plume) * 1.05)) * 20) / 20;
  syncControl('domainL');
  restart();
}

// Apply smoothed live parameters; rescale ambient region when altitude / speed change
function applyLive(dtWall) {
  if (!setup) return;
  const tg = liveTargets();
  const k = 1 - Math.exp(-dtWall * 5);
  const prev = { ...live };
  for (const key of Object.keys(tg)) {
    live[key] += (tg[key] - live[key]) * k;
    if (Math.abs(tg[key] - live[key]) < 1e-6 * Math.max(1, Math.abs(tg[key]))) live[key] = tg[key];
  }
  const cfg = cfgFromS();
  cfg.alt = live.alt; cfg.mach = live.mach; cfg.Tc = live.Tc; cfg.Mw = live.Mw;
  const newP = computeParams(cfg, setup.contour, setup.dx, live.Pc, pStartSi);
  if (P && (prev.alt !== live.alt || prev.mach !== live.mach)) {
    const fp = newP.amb[3] / P.amb[3];
    const fT = (newP.Ta) / (P.Ta);
    const du = newP.amb[1] - P.amb[1];
    if (Math.abs(fp - 1) > 1e-7 || Math.abs(fT - 1) > 1e-7 || Math.abs(du) > 1e-7) solver.rescaleAmbient(fp, fT, du, newP);
  }

// View transform
// ---------------------------------------------------------------------------
function resizeCanvas() {
  const r = $('viewport').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(64, Math.round(r.width * dpr)), H = Math.max(64, Math.round(r.height * dpr));
  if (glCanvas.width !== W || glCanvas.height !== H) {
    glCanvas.width = ovCanvas.width = W; glCanvas.height = ovCanvas.height = H;
    if (view.fitted) fitView();

}
function fitView() {
  if (!setup) return;
  const W = glCanvas.width, H = glCanvas.height;
  const y0 = S.mirror ? -setup.Nr : 0, y1 = setup.Nr;
  view.zoom = Math.min(W / setup.Nx, H / ((y1 - y0) * 0.82));
  view.cx = setup.Nx / 2;
  view.cy = S.mirror ? 0 : Math.min(setup.Nr / 2, H / view.zoom / 2);
  view.fitted = true;
  clampView();
}
function clampView() {
  if (!setup) return;
  const W = glCanvas.width, H = glCanvas.height;
  const hw = W / view.zoom / 2, hh = H / view.zoom / 2;
  view.cx = Math.min(Math.max(view.cx, Math.min(hw, setup.Nx / 2)), Math.max(setup.Nx - hw, setup.Nx / 2));
  const yMin = S.mirror ? -setup.Nr : 0;
  view.cy = Math.min(Math.max(view.cy, Math.min(yMin + hh, (yMin + setup.Nr) / 2)), Math.max(setup.Nr - hh, (yMin + setup.Nr) / 2));
}
function viewVec() {
  const W = glCanvas.width, H = glCanvas.height;
  return [view.cx - W / view.zoom / 2, view.cy - H / view.zoom / 2, W / view.zoom, H / view.zoom];
}
function screenToCell(px, py) {
  const v = viewVec(), W = glCanvas.width, H = glCanvas.height;
  return [v[0] + px / W * v[2], v[1] + (1 - py / H) * v[3]];
}
function cellToScreen(x, y, v) {
  const W = glCanvas.width, H = glCanvas.height;
  return [(x - v[0]) / v[2] * W, H - (y - v[1]) / v[3] * H];
}

  const Pc = live ? live.Pc : S.Pc * 1e5;
  switch (field) {
    case 'temp': return { r: [Math.min(0.75 * t.Te, 0.9 * Ta), 1.04 * Math.max(Tc, Ta)], unit: 'K', d: 0 };
    case 'mach': return { r: [0, Math.max(1.5, t.Me * 1.3 + S.mach)], unit: '', d: 1 };
    case 'pres': { const lo = Math.log10(Math.max(Math.min(t.pe, pa) * 0.08, 1)); return { r: [lo, Math.log10(Pc * 1.05)], unit: 'Pa', log: true, d: 0 }; }
    case 'dens': { const R = RU / S.Mw; const rc = Pc / (R * Tc); const re = t.pe / (R * t.Te); const ra = pa / (R_AIR * Ta);

const cbarCache = {};

function drawColorbar(field, bx, by, bw, dpr, tag) {

  ov.fillStyle = 'rgba(5,7,12,0.55)'; ov.fillRect(bx - 8 * dpr, by - 20 * dpr, bw + 16 * dpr, bh + 36 * dpr);
  ov.imageSmoothingEnabled = true;

  ov.fillStyle = 'rgba(200,210,230,0.75)'; ov.textBaseline = 'bottom';

  else if (field === 'flame') { lo = 'cold'; hi = 'hot exhaust'; }
  else if (field === 'exh') { lo = 'ambient air'; hi = 'pure exhaust'; }
  else if (field === 'vort') { lo = '0'; hi = 'strong shear'; }

// HUD + readback
// ---------------------------------------------------------------------------
// Read-outs are time-averaged over ~60 µs of simulated time (like a test-stand
// display), which hides chamber acoustic ringing without lagging real changes.
const AVG_TAU = 6e-5;
let lastReadT = -1;
function smoothInto(avg, now, a) { if (!avg) return { ...now }; for (const k in now) avg[k] += (now[k] - avg[k]) * a; return avg; }
function processStepInfo(si) {
  if (isFinite(si[0]) && si[0] > 0) lastDt = si[0];
  const tPrev = simTime;
  simTime = si[2] * setup.tScale;
  return tPrev;
}
function processMeasurements(tPrev, col, chA, chB) {
  const pNow = exitPerformance(setup, col);
  const cNow = cellPrimSI(setup, chA, chB);
  if (simTime < tPrev || lastReadT < 0 || !perf || !chamber) { perf = { ...pNow }; chamber = { ...cNow }; }
  else {
    const a = 1 - Math.exp(-Math.max(0, simTime - tPrev) / AVG_TAU);
    perf = smoothInto(perf, pNow, a); chamber = smoothInto(chamber, cNow, a);
  }
  lastReadT = simTime;
}
// synchronous version (used by single-step and the self-test)
function readback() {
  const tPrev = processStepInfo(solver.readStepInfo());
  const col = solver.readColumn(setup.iExit);
  const ch = solver.readCell(setup.iChamber, 0);
  processMeasurements(tPrev, col, ch.A, ch.B);
}
let axisData = null;
function processAxis(row) {
  const g = S.gamma, n = setup.Nx;
  const M = new Float32Array(n), pr = new Float32Array(n), solidRow = setup.mask.subarray(0, n);
  for (let i = 0; i < n; i++) {
    const k = i * 4, rho = Math.max(row[k], 1e-9), u = row[k + 1] / rho, v = row[k + 2] / rho;
    const p = Math.max((g - 1) * (row[k + 3] - 0.5 * rho * (u * u + v * v)), 1e-9);

}
function readAxis() { processAxis(solver._readRect(solver.state.A, 0, 0, setup.Nx, 1)); }

// Non-blocking read-back: one batched request in flight at a time, collected
// when the GPU signals it is done (no pipeline stalls).
let readGen = 0, probeCell = null, probeData = null;
function asyncReadback() {
  const res = solver.pollAsync();
  if (res && res.tag === readGen) {
    const d = res.data;
    const tPrev = processStepInfo(d.step);
    processMeasurements(tPrev, { A: d.colA, B: d.colB }, d.chA, d.chB);
    if (d.axis) processAxis(d.axis);
    if (d.prA) probeData = { cell: res.probe, q: cellPrimSI(setup, d.prA, d.prB) };
  }
  if (!solver._async) {
    const st = solver.state, reqs = [
      { name: 'step', tex: solver.stepInfoTex, x: 0, y: 0, w: 1, h: 1 },
      { name: 'colA', tex: st.A, x: setup.iExit, y: 0, w: 1, h: setup.Nr },
      { name: 'colB', tex: st.B, x: setup.iExit, y: 0, w: 1, h: setup.Nr },
      { name: 'chA', tex: st.A, x: setup.iChamber, y: 0, w: 1, h: 1 },
      { name: 'chB', tex: st.B, x: setup.iChamber, y: 0, w: 1, h: 1 },
    ];
    if (S.centerPlot) reqs.push({ name: 'axis', tex: st.A, x: 0, y: 0, w: setup.Nx, h: 1 });
    const pc = probeCell;
    if (pc) { reqs.push({ name: 'prA', tex: st.A, x: pc.i, y: pc.j, w: 1, h: 1 }, { name: 'prB', tex: st.B, x: pc.i, y: pc.j, w: 1, h: 1 }); }

function drawCenterPlot(v, W, H, dpr) {
  if (!axisData) return;

  ov.fillStyle = 'rgba(4,6,12,0.72)'; ov.fillRect(0, py0 - 18 * dpr, W, ph + 30 * dpr);
  ov.strokeStyle = 'rgba(120,130,150,0.25)'; ov.lineWidth = dpr;
  const t = theoryCache || theoryNow();
  const Mmax = Math.max(1.5, t.Me * 1.35 + S.mach);
  const pa = atmosphere(live.alt).p, lpMin = Math.log10(Math.max(Math.min(t.pe, pa) * 0.05, 1)), lpMax = Math.log10(live.Pc * 1.1);

    ov.strokeStyle = col; ov.lineWidth = 1.6 * dpr; ov.beginPath();

      if (axisData.solidRow[i]) { pen = false; continue; }
      const x = cellToScreen(i + 0.5, 0, v)[0];

  ov.textBaseline = 'top'; ov.textAlign = 'left';
  ov.fillStyle = 'rgba(63,208,255,0.95)'; ov.fillText(`MACH ON AXIS (0–${fmt(Mmax, 1)})`, 12 * dpr, py0 - 14 * dpr);
  ov.fillStyle = 'rgba(255,181,71,0.9)'; ov.fillText('PRESSURE (log)', 190 * dpr, py0 - 14 * dpr);
  ov.fillStyle = 'rgba(200,210,230,0.5)'; ov.fillText('- - M = 1 / ambient p', 320 * dpr, py0 - 14 * dpr);
}
function fmtForce(F) { return Math.abs(F) >= 1e6 ? [fmt(F / 1e6, 2), 'MN'] : Math.abs(F) >= 1000 ? [fmt(F / 1000, Math.abs(F) >= 1e5 ? 0 : 2), 'kN'] : [fmt(F, 0), 'N']; }

function updateProbe() {
  const el = $('probe');
  if (!mouse.inside || mouse.down || !setup) { el.style.display = 'none'; probeCell = null; return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const [x, y] = screenToCell(mouse.x * dpr, mouse.y * dpr);
  const i = Math.floor(x), j = Math.floor(Math.abs(y));
  if (i < 0 || i >= setup.Nx || j >= setup.Nr) { el.style.display = 'none'; probeCell = null; return; }
  const xm = (x * setup.dx), rm = (Math.abs(y) * setup.dx);
  let txt;
  if (setup.mask[j * setup.Nx + i]) { probeCell = null; txt = `wall\nx ${fmt(xm * 1000, 1)} mm  r ${fmt(rm * 1000, 1)} mm`; }
  else {
    probeCell = { i, j };
    if (!probeData) { el.style.display = 'none'; return; }
    const q = probeData.q;
    txt = `x ${fmt(xm * 1000, 1)} mm   r ${fmt(rm * 1000, 1)} mm\n` +
      `T    ${fmt(q.T, 0)} K\np    ${q.p >= 1e5 ? fmt(q.p / 1e5, 2) + ' bar' : fmt(q.p / 1000, 2) + ' kPa'}\n` +
      `Mach ${fmt(q.M, 2)}\n|u|  ${fmt(Math.hypot(q.u, q.v), 0)} m/s\nρ    ${fmt(q.rho, q.rho < 1 ? 4 : 2)} kg/m³\nexh. ${fmt(q.Y * 100, 0)} %`;
  }
  el.textContent = txt;
  el.style.display = 'block';
  const vr = $('viewport').getBoundingClientRect();
  let lx = mouse.x + 16, ly = mouse.y + 16;
  if (lx + 190 > vr.width) lx = mouse.x - 200;
  if (ly + 130 > vr.height) ly = mouse.y - 140;
  el.style.left = lx + 'px'; el.style.top = ly + 'px';
}

const recCanvas = document.createElement('canvas');

  c.beginPath(); c.moveTo(pad, hudY); c.lineTo(W - pad, hudY); c.stroke();
  met.forEach((m, k) => {

    c.fillText(m[0], x, hudY + 18 * u);

// ---------------------------------------------------------------------------
// Modes
// ---------------------------------------------------------------------------
let ascentT = 0, sweepT = 0;
function updateModes(dt) {
  if (S.ascent) {
    ascentT += dt;
    const s = Math.min(1, ascentT / S.ascentDur);
    S.alt = Math.round(S.ascentTop * Math.pow(s, 1.5) * 100) / 100;
    if (S.ascentMach) S.mach = Math.round(S.ascentMachTop * Math.pow(s, 1.1) * 100) / 100;
    syncControl('alt'); syncControl('mach');
    if (s >= 1) { S.ascent = false; syncControl('ascent'); refreshVisibility(); }
  }
  if (S.throttleSweep) {
    sweepT += dt;
    S.throttle = Math.round(70 + 30 * Math.cos(2 * Math.PI * sweepT / 8));
    syncControl('throttle');
  }
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
// GPU-load-aware step budget: a fence is placed after each frame's work. If the
// previous frames' fences have all completed when a new frame starts, the GPU
// has spare time -> add steps; if work is piling up -> back off. Works at any
// display refresh rate (60/144 Hz, or 30 fps under the browser's energy saver).
let frameFences = [];
function adaptBudget() {
  while (frameFences.length && gl.getSyncParameter(frameFences[0], gl.SYNC_STATUS) === gl.SIGNALED) gl.deleteSync(frameFences.shift());
  while (frameFences.length > 6) gl.deleteSync(frameFences.shift());
  const pending = frameFences.length;
  if (!running || selfTestRunning) return;
  if (pending >= 2) { slowFrames++; if (slowFrames >= 2) { budget = Math.max(1, budget * 0.8); slowFrames = 0; } }
  else { slowFrames = 0; if (pending === 0) budget = Math.min(S.speed, budget * 1.06 + 0.5); }
}
function frame(now) {

  if (!setup || contextLost || gl.isContextLost()) return;
  adaptBudget();
  const dtWall = Math.min(0.1, (now - lastFrameT) / 1000);
  lastFrameT = now;
  resizeCanvas();
  updateModes(dtWall);
  applyLive(dtWall);
  let n = 0;
  if (running || stepOnce) {
    n = stepOnce ? S.speed : Math.max(1, Math.min(S.speed, Math.round(budget)));
    solver.step(n, P);
    stepsTotal += n; stepsWindow += n;
    stepOnce = false;
  }
  asyncReadback();
  if (S.particles && n > 0) renderer.advectParticles(lastDt * n, [setup.contour.Lc / setup.dx, setup.contour.Rc / setup.dx, 0.8, 220]);
  const v = V();
  renderer.derive(v);
  if (v.split) renderer.derive(v, true);
  renderer.display(v, glCanvas.width, glCanvas.height);
  drawOverlay();
  updateProbe();
  if (recorder || shotPending) {
    const cv = composite();
    if (shotPending) { shotPending = false; cv.toBlob(b => download(b, `plume_${stamp()}.png`), 'image/png'); }
    if (recorder) $('b-rec').textContent = `■ Stop ${fmt((now - recStart) / 1000, 0)}s`;
  }
  minFrameDt = Math.min(minFrameDt * 1.003, Math.max(dtWall, 0.004));   // info only
  frameFences.push(gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0));
  frameNo++; fpsWindow++;
  if (now - statT > 1000) {
    stepsPerSec = stepsWindow * 1000 / (now - statT); fps = fpsWindow * 1000 / (now - statT);
    stepsWindow = 0; fpsWindow = 0; statT = now;
    $('speedval').textContent = (Math.round(budget) < S.speed && running) ? `${Math.round(budget)}/${S.speed} st/fr` : `${S.speed} st/fr`;
  }
  if (frameNo % 6 === 0) updateHUD();

}
let stepOnce = false;

function onChange(it) {

function bindEvents() {

  const sel = $('preset');
  for (const [k, e] of Object.entries(ENGINE_PRESETS)) { const o = document.createElement('option'); o.value = k; o.textContent = e.name; sel.appendChild(o); }
  const oc = document.createElement('option'); oc.value = 'custom'; oc.textContent = 'Custom (your settings)'; oc.disabled = true; sel.appendChild(oc);
  sel.value = S.preset;
  sel.onchange = () => applyPreset(sel.value);
  setInterval(() => { if (sel.value !== S.preset) sel.value = S.preset; }, 300);

  const vp = $('viewport');
  vp.addEventListener('mousemove', e => {
    const r = vp.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (mouse.down) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

    }

  });
  vp.addEventListener('mouseleave', () => { mouse.inside = false; mouse.down = false; });
  vp.addEventListener('mousedown', e => { mouse.down = true; mouse.moved = false; const r = vp.getBoundingClientRect(); mouse.lastX = e.clientX - r.left; mouse.lastY = e.clientY - r.top; vp.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', () => { mouse.down = false; vp.style.cursor = 'crosshair'; });
  vp.addEventListener('dblclick', () => { fitView(); });
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const r = vp.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    const px = (e.clientX - r.left) * dpr, py = (e.clientY - r.top) * dpr;
    const before = screenToCell(px, py);
    const f = Math.exp(-e.deltaY * 0.0015);
    const W = glCanvas.width;
    const minZoom = Math.min(W / setup.Nx, glCanvas.height / (setup.Nr * (S.mirror ? 2 : 1))) * 0.9;
    view.zoom = Math.min(Math.max(view.zoom * f, minZoom), 60);
    const after = screenToCell(px, py);

  }, { passive: false });

    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if (e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); setRunning(!running); }
    else if (k === 'r') restart();
    else if (k === 'n') { setRunning(false); stepOnce = true; }
    else if (k === 's') shotPending = true;
    else if (k === 'v') toggleRecord();
    else if (k === 'h') $('b-panel').click();
    else if (k === 'f') fitView();
    else if (k === 'm') { S.mirror = !S.mirror; syncControl('mirror'); onChange(rows.mirror.item); }
    else if (k === 'p') { S.particles = !S.particles; syncControl('particles'); }
    else if (k === 'c') { S.sonic = (S.sonic + 1) % 3; syncControl('sonic'); }

  });

}

// ---------------------------------------------------------------------------
// Self-test: exercises every feature on this machine's GPU and reports.
// Start with the "Run self-test" button (Help) or open the file with #selftest.
// ---------------------------------------------------------------------------
const sleep = ms => new Promise(r => setTimeout(r, ms));
let selfTestRunning = false;
async function runSelfTest() {
  if (selfTestRunning) return;

  const saved = JSON.parse(JSON.stringify(S));
  const lines = [];
  let pass = 0, fail = 0, warn = 0;
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;right:16px;top:16px;width:520px;max-height:calc(100vh - 32px);overflow:auto;z-index:50;background:rgba(8,10,16,.96);border:1px solid #3fd0ff;border-radius:8px;padding:14px 16px;font:12px/1.55 var(--mono);color:#c9d0de;white-space:pre-wrap';
  document.body.appendChild(box);
  const head = () => `PLUME LAB SELF-TEST   ✓ ${pass}   ✗ ${fail}   ! ${warn}\n` + '─'.repeat(56) + '\n';
  const render = (extra = '') => { box.textContent = head() + lines.join('\n') + (extra ? '\n\n' + extra : ''); box.scrollTop = box.scrollHeight; };
  const log = (status, msg) => { if (status === 'PASS') pass++; else if (status === 'FAIL') fail++; else if (status === 'WARN') warn++; lines.push(`${status === 'PASS' ? '✓' : status === 'FAIL' ? '✗' : status === 'WARN' ? '!' : '·'} ${msg}`); render(); };
  const glErr = () => { const e = gl.getError(); return e === gl.NO_ERROR ? '' : 'GL error 0x' + e.toString(16); };
  const finiteState = () => {
    const all = solver.readAll(); let bad = 0;
    for (let k = 0; k < all.A.length; k++) if (!isFinite(all.A[k])) bad++;
    return bad;
  };
  const runFor = async (ms) => {
    const s0 = stepsTotal, t0 = performance.now();
    budget = S.speed;
    setRunning(true);
